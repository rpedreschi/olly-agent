<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OCI Security Agent — Live</title>
<link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:           #080c14;
    --surface:      #0d1220;
    --surface-hi:   #131929;
    --border:       #1e2a3a;
    --text:         #e2e8f0;
    --muted:        #4a5568;
    --green:        #10b981;
    --green-dim:    #064e3b;
    --red:          #ef4444;
    --red-dim:      #7f1d1d;
    --amber:        #f59e0b;
    --amber-dim:    #78350f;
    --blue:         #3b82f6;
    --mono:         'Courier New', Courier, monospace;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 14px;
    line-height: 1.5;
  }

  /* ── Layout ─────────────────────────────────────────── */

  .layout {
    display: grid;
    grid-template-rows: 56px 1fr;
    height: 100vh;
    overflow: hidden;
  }

  /* ── Header ─────────────────────────────────────────── */

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }

  .header-title {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--text);
  }

  .header-title span.dim { color: var(--muted); font-weight: 400; }

  .live-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 6px var(--green);
    animation: pulse 2s ease-in-out infinite;
  }
  .live-dot.disconnected { background: var(--red); box-shadow: 0 0 6px var(--red); animation: none; }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.4; }
  }

  .header-meta {
    font-size: 12px;
    color: var(--muted);
    font-family: var(--mono);
  }

  /* ── Columns ─────────────────────────────────────────── */

  .columns {
    display: grid;
    grid-template-columns: 1fr 1.1fr;
    gap: 0;
    overflow: hidden;
  }

  .panel {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border-right: 1px solid var(--border);
  }
  .panel:last-child { border-right: none; }

  .panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }

  .panel-title {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .count-badge {
    font-size: 11px;
    font-family: var(--mono);
    background: var(--surface-hi);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1px 8px;
    color: var(--muted);
    min-width: 28px;
    text-align: center;
    transition: color 0.2s;
  }

  .feed {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .feed::-webkit-scrollbar { width: 4px; }
  .feed::-webkit-scrollbar-track { background: transparent; }
  .feed::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    gap: 8px;
    color: var(--muted);
    font-size: 13px;
  }
  .empty-state .icon { font-size: 28px; opacity: 0.4; }

  /* ── Cards ───────────────────────────────────────────── */

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    animation: slideIn 0.3s ease-out;
    flex-shrink: 0;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .card.flash-green {
    animation: slideIn 0.3s ease-out, flashGreen 1.2s ease-out;
  }
  .card.flash-red {
    animation: slideIn 0.3s ease-out, flashRed 1.2s ease-out;
  }

  @keyframes flashGreen {
    0%   { border-color: var(--green); box-shadow: 0 0 16px var(--green-dim); }
    100% { border-color: var(--border); box-shadow: none; }
  }
  @keyframes flashRed {
    0%   { border-color: var(--red); box-shadow: 0 0 16px var(--red-dim); }
    100% { border-color: var(--border); box-shadow: none; }
  }

  /* ── Card internals ─────────────────────────────────── */

  .card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 10px;
  }

  .card-badges { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }

  .badge {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 2px 8px;
    border-radius: 4px;
  }
  .badge-action   { background: #1e3a5f; color: var(--blue); }
  .badge-confirmed { background: var(--green-dim); color: var(--green); }
  .badge-failed   { background: var(--red-dim); color: var(--red); }
  .badge-pending  { background: #1c1a10; color: var(--amber); }
  .badge-anomaly  { background: var(--amber-dim); color: var(--amber); }

  .card-time {
    font-size: 11px;
    font-family: var(--mono);
    color: var(--muted);
    white-space: nowrap;
    flex-shrink: 0;
  }

  .card-target {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text);
    margin-bottom: 6px;
    word-break: break-all;
  }

  .card-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 2px;
    margin-top: 8px;
  }

  .card-value {
    font-size: 12px;
    color: #94a3b8;
    line-height: 1.4;
  }

  .card-value.mono {
    font-family: var(--mono);
    font-size: 11px;
  }

  .card-divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 10px 0;
  }

  .card-response {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 8px;
    max-height: 72px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .card-response::-webkit-scrollbar { width: 3px; }
  .card-response::-webkit-scrollbar-thumb { background: var(--border); }

  .status-row {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .status-dot {
    width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
  }
  .status-dot.confirmed { background: var(--green); }
  .status-dot.failed    { background: var(--red); }
  .status-dot.pending   { background: var(--amber); }
</style>
</head>
<body>
<div class="layout">

  <header>
    <div class="header-title">
      <div class="live-dot" id="liveDot"></div>
      OCI Security Agent
      <span class="dim">/ Live Stream</span>
    </div>
    <div class="header-meta" id="headerMeta">connecting…</div>
  </header>

  <div class="columns">

    <!-- Left: Agent chat (iframe to OpenAI Agent Builder share URL) -->
    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">Agent Chat</span>
        <span class="count-badge" id="anomalyCount" style="display:none">0</span>
      </div>
      <div id="chatContainer" style="flex:1; overflow:hidden; display:flex; flex-direction:column;">
        <iframe id="chatFrame"
                style="flex:1; width:100%; border:0; background:var(--surface);"
                allow="clipboard-write; clipboard-read"></iframe>
        <div id="chatHint" style="display:none; padding:24px; color:var(--muted); font-size:13px; line-height:1.6;">
          <p>Pass <code style="color:var(--text)">?chat=&lt;your-agent-url&gt;</code> in the URL to embed your agent here.</p>
          <p style="margin-top:12px">Example:<br>
            <code style="color:var(--text); font-size:11px;">http://localhost:3000/?chat=https://platform.openai.com/agents/asst_xxx</code>
          </p>
        </div>
      </div>
    </div>
    <!-- Audit anomaly feed elements kept for compatibility with existing JS -->
    <div id="anomalyFeed" style="display:none"></div>
    <div id="anomalyEmpty" style="display:none"></div>

    <!-- Right: Agent actions (the money shot) -->
    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">Agent Actions</span>
        <span class="count-badge" id="actionCount">0</span>
      </div>
      <div class="feed" id="actionFeed">
        <div class="empty-state" id="actionEmpty">
          <span class="icon">⚡</span>
          Waiting for agent to act…
        </div>
      </div>
    </div>

  </div>
</div>

<script>
  // ── Chat iframe ─────────────────────────────────────────
  (function () {
    const params = new URLSearchParams(window.location.search);
    const chatUrl = params.get('chat');
    const frame = document.getElementById('chatFrame');
    const hint  = document.getElementById('chatHint');
    if (chatUrl) {
      frame.src = chatUrl;
    } else {
      frame.style.display = 'none';
      hint.style.display = 'block';
    }
  })();

  // ── Counters ────────────────────────────────────────────
  let anomalyCount = 0;
  let actionCount  = 0;

  function inc(elId) {
    const el = document.getElementById(elId);
    const n  = parseInt(el.textContent, 10) + 1;
    el.textContent = n;
    el.style.color = 'var(--text)';
    setTimeout(() => { el.style.color = ''; }, 800);
  }

  // ── Time formatting ─────────────────────────────────────
  function fmtTime(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    if (isNaN(d)) return iso;
    return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }

  function fmtFull(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    if (isNaN(d)) return iso;
    return d.toISOString().replace('T', ' ').slice(0, 19) + ' UTC';
  }

  function truncate(str, n = 72) {
    if (!str) return '—';
    return str.length > n ? str.slice(0, n) + '…' : str;
  }

  // ── Prepend card to feed ────────────────────────────────
  function prepend(feedId, emptyId, cardEl) {
    const feed  = document.getElementById(feedId);
    const empty = document.getElementById(emptyId);
    if (empty) empty.remove();
    feed.insertBefore(cardEl, feed.firstChild);
    // cap feed at 50 cards
    while (feed.children.length > 50) feed.removeChild(feed.lastChild);
  }

  // ── Action card ─────────────────────────────────────────
  function addActionCard(d) {
    const status   = (d.status || 'pending').toLowerCase();
    const flashCls = status === 'confirmed' ? 'flash-green'
                   : status === 'failed'    ? 'flash-red'
                   : '';

    let responseHtml = '';
    if (d.oci_response) {
      let pretty = d.oci_response;
      try { pretty = JSON.stringify(JSON.parse(d.oci_response), null, 2); } catch {}
      responseHtml = `
        <div class="card-label">OCI response</div>
        <pre class="card-response">${esc(pretty)}</pre>`;
    }

    const card = document.createElement('div');
    card.className = `card ${flashCls}`;
    card.innerHTML = `
      <div class="card-top">
        <div class="card-badges">
          <span class="badge badge-action">${esc(d.action_type || 'action')}</span>
          <span class="badge badge-${status}">${status}</span>
        </div>
        <span class="card-time">${fmtTime(d.action_time)}</span>
      </div>

      <div class="card-label">principal</div>
      <div class="card-target">${esc(d.target_id || '—')}</div>

      <div class="card-label">reason</div>
      <div class="card-value">${esc(truncate(d.reason, 140))}</div>

      <hr class="card-divider">

      <div class="status-row">
        <div class="status-dot ${status}"></div>
        <span class="card-value mono">${fmtFull(d.action_time)}</span>
      </div>

      ${d.triggered_by ? `
        <div class="card-label" style="margin-top:6px">triggered by</div>
        <div class="card-value mono">${esc(d.triggered_by)}</div>` : ''}

      ${responseHtml}
    `;

    prepend('actionFeed', 'actionEmpty', card);
    inc('actionCount');
  }

  // ── Anomaly card ─────────────────────────────────────────
  function addAnomalyCard(d) {
    const status = String(d.responsestatus || '');
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-top">
        <div class="card-badges">
          <span class="badge badge-anomaly">${esc(status)}</span>
          <span class="badge" style="background:#1a1a2e;color:#818cf8">${esc(truncate(d.eventname || d.requestaction || 'event', 28))}</span>
        </div>
        <span class="card-time">${fmtTime(d.audittime)}</span>
      </div>

      <div class="card-label">principal</div>
      <div class="card-target">${esc(d.principalname || d.principalid || '—')}</div>

      <div class="card-label">path</div>
      <div class="card-value mono">${esc(truncate(d.requestpath || '—', 80))}</div>

      ${d.compartmentid ? `
        <div class="card-label" style="margin-top:8px">compartment</div>
        <div class="card-value mono">${esc(truncate(d.compartmentid, 60))}</div>` : ''}
    `;

    prepend('anomalyFeed', 'anomalyEmpty', card);
    inc('anomalyCount');
  }

  // ── HTML escape ──────────────────────────────────────────
  function esc(str) {
    return String(str ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // ── SSE connection ───────────────────────────────────────
  const dot    = document.getElementById('liveDot');
  const meta   = document.getElementById('headerMeta');
  let connTime = null;

  function connect() {
    const es = new EventSource('/events');

    es.onopen = () => {
      connTime = new Date();
      dot.classList.remove('disconnected');
      meta.textContent = `connected · ${connTime.toLocaleTimeString()}`;
    };

    es.onmessage = (e) => {
      const data = JSON.parse(e.data);
      if (data.type === 'action')  addActionCard(data);
      if (data.type === 'anomaly') addAnomalyCard(data);
    };

    es.onerror = () => {
      dot.classList.add('disconnected');
      meta.textContent = 'reconnecting…';
      es.close();
      setTimeout(connect, 3000);
    };
  }

  connect();
</script>
</body>
</html>
